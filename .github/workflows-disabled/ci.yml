name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Protobuf 3.12.4
            preset: linux-gcc-pb3
            cmake_spec: "cmake>=4.2,<5"
          - name: Linux / Protobuf 5.29.5
            preset: linux-gcc-pb5
            cmake_spec: "cmake>=4.2,<5"
          - name: Linux / Protobuf 6.33.4
            preset: linux-gcc-pb6
            cmake_spec: "cmake>=4.2,<5"
          - name: Linux / Protobuf 7.36.1
            preset: linux-gcc-pb7
            cmake_spec: "cmake>=4.2,<5"
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-14 g++-14 ninja-build ca-certificates
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install CMake
        run: python -m pip install "${{ matrix.cmake_spec }}"
      - name: Configure, build, and test
        run: cmake --workflow --preset "${{ matrix.preset }}"
        env:
          CC: gcc-14
          CXX: g++-14

  windows:
    name: Windows / Visual Studio 2026
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build, and test
        run: cmake --workflow --preset windows-vs2026
