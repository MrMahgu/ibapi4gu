name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux native / current CMake
            preset: linux-gcc
            cmake_spec: "cmake>=4.2,<5"
            needs_msitools: false
          - name: Linux MSI / current CMake
            preset: linux-gcc-msi
            cmake_spec: "cmake>=4.2,<5"
            needs_msitools: true
          - name: Linux native / CMake 4.2.0
            preset: linux-gcc
            cmake_spec: "cmake==4.2.0"
            needs_msitools: false
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-14 g++-14 ninja-build ca-certificates
      - name: Install MSI extraction support
        if: matrix.needs_msitools
        run: sudo apt-get install --yes msitools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install CMake
        run: python -m pip install "${{ matrix.cmake_spec }}"
      - name: Configure, build, and test
        run: cmake --workflow --preset "${{ matrix.preset }}"
        env:
          CC: gcc-14
          CXX: g++-14

  windows:
    name: Windows / Visual Studio 2026
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build, and test
        run: cmake --workflow --preset windows-vs2026
