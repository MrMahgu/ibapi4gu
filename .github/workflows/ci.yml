name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / current CMake
            preset: linux-gcc
            minimum_cmake: false
          - name: Linux / CMake 3.28.3
            preset: linux-gcc
            minimum_cmake: true
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ninja-build ca-certificates
      - uses: actions/setup-python@v7
        if: matrix.minimum_cmake
        with:
          python-version: "3.x"
      - name: Install minimum CMake
        if: matrix.minimum_cmake
        run: python -m pip install cmake==3.28.3
      - name: Configure, build, and test
        run: cmake --workflow --preset "${{ matrix.preset }}"

  windows:
    name: Windows / Visual Studio 2026
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build, and test
        run: cmake --workflow --preset windows-vs2026
